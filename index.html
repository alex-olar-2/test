<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WebAR Carte de Vizită</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; background: #000; font-family: Arial, sans-serif;
        }

        #welcome {
            position: fixed; inset: 0; z-index: 100000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 25px; color: white; text-align: center;
            background: radial-gradient(circle at center, #202020 0%, #080808 70%);
        }
        #welcome h1 { margin: 0 0 15px; font-size: 25px; }
        #welcome p { max-width: 320px; margin: 0; color: #aaa; line-height: 1.5; font-size: 15px; }
        #startButton {
            margin-top: 30px; padding: 16px 35px; border: 0; border-radius: 50px;
            background: #19c463; color: white; font-size: 17px; font-weight: bold;
            box-shadow: 0 5px 25px rgba(25,196,99,.4);
        }
        #startButton:active { transform: scale(0.96); }

        #loading {
            display: none; position: fixed; inset: 0; z-index: 99999;
            align-items: center; justify-content: center;
            background: #000; color: white; text-align: center;
        }

        #arUI {
            display: none; position: fixed; left: 50%; bottom: 25px;
            transform: translateX(-50%); z-index: 9999;
            width: calc(100% - 30px); max-width: 420px; padding: 12px;
            border-radius: 25px; background: rgba(0,0,0,.82); gap: 10px;
            justify-content: center;
        }
        .arButton {
            flex: 1; display: block; padding: 13px 10px; border-radius: 20px;
            color: white; text-decoration: none; text-align: center;
            font-size: 14px; font-weight: bold; background: #0077b5;
        }
        .arButton.portfolio { background: #24292e; }

        #instruction {
            display: none; position: fixed; top: 25px; left: 50%;
            transform: translateX(-50%); z-index: 9998;
            width: calc(100% - 40px); max-width: 350px; padding: 12px 18px;
            border-radius: 20px; background: rgba(0,0,0,.7);
            color: white; text-align: center; font-size: 14px;
        }

        a-scene { position: fixed !important; inset: 0 !important; }
        .a-enter-vr { display: none !important; }
    </style>
</head>
<body>

    <div id="welcome">
        <h1>📱 WebAR</h1>
        <p>Pentru a începe experiența AR trebuie să permiți accesul la cameră.</p>
        <button id="startButton">PORNEȘTE AR</button>
    </div>

    <div id="loading">
        <div>
            <div style="font-size:35px;">📷</div>
            <p>Se pornește camera...</p>
        </div>
    </div>

    <div id="instruction">Îndreaptă camera către markerul <b>HIRO</b></div>

    <div id="arUI">
        <a class="arButton" href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
        <a class="arButton portfolio" href="https://github.com/" target="_blank" rel="noopener">Portofoliu</a>
    </div>

    <!-- Scena AR se creează DOAR după click -->
    <div id="sceneContainer"></div>

    <script>
        const welcome = document.getElementById("welcome");
        const startButton = document.getElementById("startButton");
        const loading = document.getElementById("loading");
        const arUI = document.getElementById("arUI");
        const instruction = document.getElementById("instruction");
        const container = document.getElementById("sceneContainer");

        let started = false;
        let checkTimer = null;

        function showReady() {
            loading.style.display = "none";
            instruction.style.display = "block";
        }

        function showError(msg) {
            if (checkTimer) clearInterval(checkTimer);
            loading.style.display = "none";
            welcome.style.display = "flex";
            container.innerHTML = "";
            started = false;
            alert(msg);
        }

        startButton.addEventListener("click", function () {
            if (started) return;
            started = true;

            welcome.style.display = "none";
            loading.style.display = "flex";

            // Fișierele camera_para.dat și patt.hiro sunt luate local (din repository)
            container.innerHTML = `
                <a-scene
                    embedded
                    vr-mode-ui="enabled: false"
                    renderer="antialias: true; alpha: true"
                    arjs="sourceType: webcam; debugUIEnabled: false; cameraParametersUrl: camera_para.dat; trackingMethod: best;">

                    <a-marker id="hiroMarker" type="pattern" url="patt.hiro">
                        <!-- PERSONAJ 3D: cățel din forme simple -->
                        <a-entity id="dog" position="0 0 0" scale="1.1 1.1 1.1"
                                  animation="property: position; from: 0 0 0; to: 0 0.06 0; dir: alternate; loop: true; dur: 700; easing: easeInOutSine">

                            <a-entity animation="property: rotation; from: 0 -20 0; to: 0 20 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine">

                                <!-- corp -->
                                <a-sphere position="0 0.42 0" radius="0.3" scale="0.85 0.8 1.3" color="#d9a066"></a-sphere>
                                <a-sphere position="0 0.38 0.05" radius="0.25" scale="0.9 0.6 1.1" color="#f5e0c3"></a-sphere>

                                <!-- cap -->
                                <a-sphere position="0 0.78 0.38" radius="0.24" color="#d9a066"></a-sphere>

                                <!-- bot -->
                                <a-sphere position="0 0.7 0.58" radius="0.12" scale="1 0.8 1.1" color="#f5e0c3"></a-sphere>
                                <a-sphere position="0 0.74 0.69" radius="0.045" color="#111111"></a-sphere>

                                <!-- limba -->
                                <a-box position="0 0.6 0.66" width="0.06" height="0.02" depth="0.08" color="#ff6f91"
                                       animation="property: scale; from: 1 1 1; to: 1 1 1.8; dir: alternate; loop: true; dur: 500; easing: easeInOutSine">
                                </a-box>

                                <!-- ochi -->
                                <a-sphere position="-0.09 0.85 0.55" radius="0.05" color="#ffffff"></a-sphere>
                                <a-sphere position="0.09 0.85 0.55" radius="0.05" color="#ffffff"></a-sphere>
                                <a-sphere position="-0.09 0.85 0.59" radius="0.028" color="#111111"></a-sphere>
                                <a-sphere position="0.09 0.85 0.59" radius="0.028" color="#111111"></a-sphere>

                                <!-- urechi -->
                                <a-sphere position="-0.2 0.9 0.36" radius="0.1" scale="0.5 1.2 0.8" rotation="0 0 20" color="#8b5a2b"></a-sphere>
                                <a-sphere position="0.2 0.9 0.36" radius="0.1" scale="0.5 1.2 0.8" rotation="0 0 -20" color="#8b5a2b"></a-sphere>

                                <!-- picioare -->
                                <a-cylinder position="-0.15 0.15 0.25" radius="0.07" height="0.3" color="#d9a066"></a-cylinder>
                                <a-cylinder position="0.15 0.15 0.25" radius="0.07" height="0.3" color="#d9a066"></a-cylinder>
                                <a-cylinder position="-0.15 0.15 -0.25" radius="0.07" height="0.3" color="#d9a066"></a-cylinder>
                                <a-cylinder position="0.15 0.15 -0.25" radius="0.07" height="0.3" color="#d9a066"></a-cylinder>

                                <!-- coada (se mișcă) -->
                                <a-entity position="0 0.5 -0.38" rotation="-40 -30 0"
                                          animation="property: rotation; from: -40 -30 0; to: -40 30 0; dir: alternate; loop: true; dur: 300; easing: easeInOutSine">
                                    <a-cylinder position="0 0.12 0" radius="0.04" height="0.28" color="#8b5a2b"></a-cylinder>
                                </a-entity>
                            </a-entity>
                        </a-entity>

                        <a-text value="Salut! Sunt un catel 3D AR" position="0 1.5 0"
                                align="center" color="#00FFCC" width="4" side="double">
                        </a-text>

                        <a-plane position="0 0 0" rotation="-90 0 0" width="2" height="2"
                                 color="#111111" opacity="0.6">
                        </a-plane>
                    </a-marker>

                    <a-entity camera></a-entity>
                </a-scene>
            `;

            const scene = container.querySelector("a-scene");
            const marker = container.querySelector("#hiroMarker");

            scene.addEventListener("camera-init", showReady);

            scene.addEventListener("camera-error", function () {
                showError("Nu s-a putut accesa camera. Verifică permisiunea și că pagina e deschisă prin HTTPS.");
            });

            marker.addEventListener("markerFound", function () {
                arUI.style.display = "flex";
                instruction.style.display = "none";
            });

            marker.addEventListener("markerLost", function () {
                arUI.style.display = "none";
                instruction.style.display = "block";
            });

            // Fallback: dacă evenimentul camera-init nu vine, verificăm video-ul
            let tries = 0;
            checkTimer = setInterval(function () {
                tries++;
                const video = document.querySelector("video");
                if (video && video.readyState >= 2) {
                    clearInterval(checkTimer);
                    if (loading.style.display !== "none") showReady();
                } else if (tries > 40) { // ~20 secunde
                    clearInterval(checkTimer);
                    if (loading.style.display !== "none") {
                        showError("Camera nu a pornit. Încearcă din nou sau deschide pagina în Chrome/Safari.");
                    }
                }
            }, 500);
        });
    </script>
</body>
</html>
