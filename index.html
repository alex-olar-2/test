<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Aplicație WebAR Stabilă</title>
    
    <!-- VERSIONS ULTRA-STABILE PENTRU MOBIL (iOS & Android) -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        /* Ecran de start simplu pentru interactiune fizica */
        #ar-welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #start-ar-button {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #28a745;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            margin-top: 20px;
        }
        /* Meniu butoane sociale */
        #ar-ui-overlay {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: none;
            flex-direction: row;
            gap: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .ar-btn {
            color: white;
            text-decoration: none;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
            padding: 10px 20px;
            background: #007bff;
            border-radius: 20px;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Ecranul de pornire care deblocheaza audio/video pe mobil -->
    <div id="ar-welcome-screen">
        <h2>Aplicație WebAR Carte de Vizită</h2>
        <p style="color: #aaa; font-size: 14px; max-width: 280px;">Apasă butonul de mai jos pentru a activa camera și experiența 3D.</p>
        <button id="start-ar-button">PORNEȘTE AR</button>
    </div>

    <!-- UI pentru linkuri (apare doar cand markerul e detectat) -->
    <div id="ar-ui-overlay">
        <a href="https://linkedin.com" target="_blank" class="ar-btn">LinkedIn</a>
        <a href="https://github.com" target="_blank" class="ar-btn" style="background:#28a745;">Portofoliu</a>
    </div>

    <!-- Scena AR realiniata cu bunele practici AR.js 3.x -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_matrix; cameraParametersUrl: https://githubusercontent.com;"
        renderer="colorManagement: true; antialias: true;">
        
        <a-assets>
            <!-- Model 3D stabil (Cutie texturata de test livrata direct de A-Frame ca sa eliminam riscul de descarcare lenta a robotului) -->
            <a-asset-item id="testBox" src="https://githubusercontent.com"></a-asset-item>
        </a-assets>

        <!-- Ancorare pe markerul standard HIRO -->
        <a-marker preset="hiro" id="ar-marker">
            
            <!-- Modelul unui catelus Shiba (Inlocuieste robotul precedent care putea genera erori de incarcare pe retele mobile) -->
            
            

            <!-- Text Plutitor -->
            <a-text 
                value="Salut! Sunt un catel 3D AR" 
                position="0 1.5 0" 
                align="center" 
                color="#00FFCC" 
                width="4"
                font="mozillavr">
            </a-text>

        </a-marker>

        <!-- Camera obligatorie pentru randare -->
        
    </a-scene>

    <script>
        const welcomeScreen = document.getElementById('ar-welcome-screen');
        const startButton = document.getElementById('start-ar-button');
        const marker = document.getElementById('ar-marker');
        const uiOverlay = document.getElementById('ar-ui-overlay');

        // Logica simplificata: ascundem ecranul doar la interactiunea fizica a utilizatorului
        startButton.addEventListener('click', function() {
            welcomeScreen.style.display = 'none';
            
            // Fortam browserul mobil sa recalculeze dimensiunea containerului video
            setTimeout(function() {
                window.dispatchEvent(new Event('resize'));
            }, 500);
        });

        // Evenimente detectie marker
        marker.addEventListener('markerFound', () => {
            uiOverlay.style.display = 'flex';
        });

        marker.addEventListener('markerLost', () => {
            uiOverlay.style.display = 'none';
        });
    </script>
</body>
</html>
